server:
  port: 8088
spring:
  application:
    name: pharmacy-app
  datasource:
    url: jdbc:mysql://localhost:3306/pharmacy-app?createDatabaseIfNotExist=true
    username: root
    password: root
  jpa:
    show-sql: true
  flyway:
    baseline-on-migrate: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenValidity: 7200000
    refreshTokenValidity: 604800000
    secureCookie: false
    sameSite: Lax
